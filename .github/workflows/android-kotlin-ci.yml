name: Kotlin Android CI Workflow

on:
  push:
    branches:
      - "master"
      - "develop"
  pull_request:
    branches:
      - "master"
      - "develop"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code (Updated to v4)
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up JDK 21 (Updated to v4)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # Step 3: Setup Gradle and Cache (Official Best Practice)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Step 4: Grant executable permissions to the gradlew script
      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      # Step 5: Build the project
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # Step 6: Run Lint checks
      - name: Run Kotlin Lint
        run: ./gradlew lintDebug

      # Step 7: Run unit tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
